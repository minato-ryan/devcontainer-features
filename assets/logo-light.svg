<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Dev Container Features logo">
  <defs>
    <linearGradient id="bgLight" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="cubeTopLight" x1="32" y1="42" x2="96" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="cubeLeftLight" x1="32" y1="60" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="cubeRightLight" x1="64" y1="60" x2="96" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="pluginTopLight" x1="50" y1="18" x2="78" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="pluginLeftLight" x1="50" y1="26" x2="64" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pluginRightLight" x1="64" y1="26" x2="78" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgLight)" stroke="#CBD5E1" stroke-width="2" />

  <!-- Base container cube -->
  <polygon points="64,42 96,60 64,78 32,60" fill="url(#cubeTopLight)" />
  <polygon points="32,60 64,78 64,112 32,94" fill="url(#cubeLeftLight)" />
  <polygon points="64,78 96,60 96,94 64,112" fill="url(#cubeRightLight)" />

  <!-- Subtle edge highlights -->
  <polyline points="32,60 64,78 96,60" stroke="#E0F2FE" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="64" y1="78" x2="64" y2="112" stroke="#E0F2FE" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Container side ribs -->
  <line x1="42" y1="73" x2="42" y2="92" stroke="#A5B4FC" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="79" x2="52" y2="98" stroke="#A5B4FC" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="79" x2="76" y2="98" stroke="#BAE6FD" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="73" x2="86" y2="92" stroke="#BAE6FD" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />

  <!-- Socket shadow on top face -->
  <polygon points="64,51 78,59 64,67 50,59" fill="#1E1B4B" fill-opacity="0.22" />

  <!-- Floating feature module cube -->
  <polygon points="64,17 78,25 64,33 50,25" fill="url(#pluginTopLight)" />
  <polygon points="50,25 64,33 64,48 50,40" fill="url(#pluginLeftLight)" />
  <polygon points="64,33 78,25 78,40 64,48" fill="url(#pluginRightLight)" />
  <polyline points="50,25 64,33 78,25" stroke="#ECFDF5" stroke-opacity="0.85" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
</svg>
