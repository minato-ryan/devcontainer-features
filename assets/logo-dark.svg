<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Dev Container Features logo">
  <defs>
    <linearGradient id="bgDark" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cubeTopDark" x1="32" y1="42" x2="96" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="cubeLeftDark" x1="32" y1="60" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="cubeRightDark" x1="64" y1="60" x2="96" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pluginTopDark" x1="50" y1="18" x2="78" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <linearGradient id="pluginLeftDark" x1="50" y1="26" x2="64" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pluginRightDark" x1="64" y1="26" x2="78" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgDark)" stroke="#334155" stroke-width="2" />

  <!-- Base container cube -->
  <polygon points="64,42 96,60 64,78 32,60" fill="url(#cubeTopDark)" />
  <polygon points="32,60 64,78 64,112 32,94" fill="url(#cubeLeftDark)" />
  <polygon points="64,78 96,60 96,94 64,112" fill="url(#cubeRightDark)" />

  <!-- Crisp edge highlights -->
  <polyline points="32,60 64,78 96,60" stroke="#F0F9FF" stroke-opacity="0.75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="64" y1="78" x2="64" y2="112" stroke="#F0F9FF" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Container side ribs -->
  <line x1="42" y1="73" x2="42" y2="92" stroke="#C7D2FE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="79" x2="52" y2="98" stroke="#C7D2FE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />
  <line x1="76" y1="79" x2="76" y2="98" stroke="#CFFAFE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="73" x2="86" y2="92" stroke="#CFFAFE" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" />

  <!-- Socket shadow on top face -->
  <polygon points="64,51 78,59 64,67 50,59" fill="#0F172A" fill-opacity="0.35" />

  <!-- Floating feature module cube -->
  <polygon points="64,17 78,25 64,33 50,25" fill="url(#pluginTopDark)" />
  <polygon points="50,25 64,33 64,48 50,40" fill="url(#pluginLeftDark)" />
  <polygon points="64,33 78,25 78,40 64,48" fill="url(#pluginRightDark)" />
  <polyline points="50,25 64,33 78,25" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
</svg>
