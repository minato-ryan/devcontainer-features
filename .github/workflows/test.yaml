name: "CI - Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      features: ${{ steps.result.outputs.features }}
      run_global: ${{ steps.result.outputs.run_global }}
    steps:
      - uses: actions/checkout@v4

      - name: "Detect changed features (push/PR)"
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: ./.github/actions/generate-path-filters
        id: changed

      - name: "List all features (workflow_dispatch)"
        id: all
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          shopt -s nullglob
          features=()
          for dir in src/*/; do
            name=$(basename "$dir")
            if [[ ! "$name" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "::error::Invalid feature directory name: $name" >&2
              exit 1
            fi
            features+=("$name")
          done
          if [ ${#features[@]} -eq 0 ]; then
            echo "features=[]" >> "$GITHUB_OUTPUT"
          else
            echo "features=$(printf '%s\n' "${features[@]}" | jq -Rc . | jq -sc 'sort')" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: "Resolve test targets"
        id: result
        env:
          CHANGED_FEATURES: ${{ steps.changed.outputs.features }}
          GLOBAL_CHANGED: ${{ steps.changed.outputs.global }}
          ALL_FEATURES: ${{ steps.all.outputs.features }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            features="${ALL_FEATURES:-[]}"
            run_global="true"
          else
            features="${CHANGED_FEATURES:-[]}"
            if [ "$GLOBAL_CHANGED" = "true" ]; then
              run_global="true"
            elif [ -f test/_global/scenarios.json ]; then
              jq empty test/_global/scenarios.json
              if jq -e --argjson changed "$features" \
                '[.[].features | objects | keys[] | ltrimstr("./")] | any(. as $k | $changed | index($k) != null)' \
                test/_global/scenarios.json >/dev/null; then
                run_global="true"
              else
                run_global="false"
              fi
            else
              run_global="false"
            fi
          fi
          echo "features=${features}" >> "$GITHUB_OUTPUT"
          echo "run_global=${run_global}" >> "$GITHUB_OUTPUT"

      - name: "Write detected features summary"
        env:
          FEATURES: ${{ steps.result.outputs.features }}
          RUN_GLOBAL: ${{ steps.result.outputs.run_global }}
        run: |
          {
            echo "## Detected features for testing"
            echo
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Manual run: all features and global scenarios are selected."
            else
              echo "Changed-feature run: selected features are based on path filters."
            fi
            echo
            if [ -z "$FEATURES" ] || [ "$FEATURES" = "[]" ]; then
              echo "No feature changes were detected for this workflow run."
            else
              count=$(printf '%s' "$FEATURES" | jq 'length')
              echo "Detected ${count} feature(s):"
              echo
              echo "| Feature |"
              echo "|---|"
              printf '%s' "$FEATURES" | jq -r '.[] | "| `" + . + "` |"'
            fi
            echo
            echo "Global scenarios: \`${RUN_GLOBAL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test-autogenerated:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE" .

  test-scenarios:
    needs: changes
    if: ${{ needs.changes.outputs.features != '[]' && needs.changes.outputs.features != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.changes.outputs.features) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' scenarios"
        env:
          FEATURE: ${{ matrix.features }}
        run: devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated .

  test-global:
    needs: changes
    if: ${{ needs.changes.outputs.run_global == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
